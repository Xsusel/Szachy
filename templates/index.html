<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XsusBot Chess</title>

    <!-- CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="container">
    <h1>XsusBot</h1>
    <div id="status">Twój ruch (Białe)</div>
    <div id="board" style="width: 400px"></div>
    <div class="controls">
        <button id="resetBtn">Nowa Gra</button>
        <button id="flipBtn">Obróć Szachownicę</button>
    </div>
    <div id="fen"></div>

    <!-- Promotion Modal -->
    <div id="promotion-modal" class="modal">
        <div class="modal-content">
            <h3>Wybierz figurę do promocji:</h3>
            <div class="promotion-pieces">
                <img src="/static/img/chesspieces/wikipedia/wQ.svg" onclick="commitPromotion('q')" id="promo-q">
                <img src="/static/img/chesspieces/wikipedia/wR.svg" onclick="commitPromotion('r')" id="promo-r">
                <img src="/static/img/chesspieces/wikipedia/wB.svg" onclick="commitPromotion('b')" id="promo-b">
                <img src="/static/img/chesspieces/wikipedia/wN.svg" onclick="commitPromotion('n')" id="promo-n">
            </div>
        </div>
    </div>
</div>

<!-- JS Libraries -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="/static/js/main.js"></script>

</body>
</html>
